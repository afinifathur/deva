<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <!-- Map / Location pin & radius visual -->
  <g transform="translate(420, 240)">
    <circle cx="0" cy="0" r="110" fill="rgba(52, 211, 153, 0.1)" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6,4" />
    <circle cx="0" cy="0" r="70" fill="rgba(52, 211, 153, 0.15)" stroke="#34D399" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#10B981" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>
  <g transform="translate(140, 240)">
    <rect x="0" y="-40" width="160" height="80" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" />
    <text x="20" y="-12" fill="#34D399" font-family="system-ui, sans-serif" font-weight="700" font-size="12">CATCHMENT RADIUS</text>
    <text x="20" y="18" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="20">Feasibility Matrix</text>
  </g>
  <text x="60" y="80" fill="#34D399" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="2">DEVA MARKET FEASIBILITY</text>
  <text x="60" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="28">Studi Kelayakan Pendirian Farmasi</text>
</svg>
