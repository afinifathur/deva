<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0F2942" />
      <stop offset="100%" stop-color="#005AA9" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <circle cx="680" cy="120" r="140" fill="#005AA9" opacity="0.3" filter="blur(40px)" />
  <!-- Chart visual -->
  <g transform="translate(160, 260)">
    <rect x="0" y="-80" width="45" height="80" rx="4" fill="rgba(255,255,255,0.2)" />
    <rect x="65" y="-140" width="45" height="140" rx="4" fill="rgba(255,255,255,0.3)" />
    <rect x="130" y="-110" width="45" height="110" rx="4" fill="rgba(255,255,255,0.25)" />
    <rect x="195" y="-190" width="45" height="190" rx="4" fill="#38BDF8" />
    <rect x="260" y="-150" width="45" height="150" rx="4" fill="rgba(255,255,255,0.35)" />
    <rect x="325" y="-170" width="45" height="170" rx="4" fill="rgba(255,255,255,0.4)" />
    <rect x="390" y="-220" width="45" height="220" rx="4" fill="#60A5FA" />
    <line x1="-20" y1="0" x2="480" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <!-- Trend line -->
    <path d="M 22 -90 Q 150 -160 217 -200 T 412 -230" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="6,4" />
  </g>
  <text x="60" y="80" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="2">DEVA HEALTHCARE ANALYTICS</text>
  <text x="60" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="28">Analisis Biaya Klaim &amp; Utilisasi</text>
</svg>
