<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <!-- Data points / Cluster visual -->
  <g transform="translate(140, 180)">
    <circle cx="80" cy="80" r="45" fill="rgba(129, 140, 248, 0.25)" stroke="#A5B4FC" stroke-width="2" />
    <circle cx="240" cy="50" r="60" fill="rgba(192, 132, 252, 0.25)" stroke="#C084FC" stroke-width="2" />
    <circle cx="400" cy="90" r="50" fill="rgba(244, 114, 182, 0.25)" stroke="#F472B6" stroke-width="2" />
    <!-- Link lines -->
    <line x1="80" y1="80" x2="240" y2="50" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="240" y1="50" x2="400" y2="90" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Inner nodes -->
    <circle cx="80" cy="80" r="6" fill="#FFFFFF" />
    <circle cx="240" cy="50" r="8" fill="#FFFFFF" />
    <circle cx="400" cy="90" r="6" fill="#FFFFFF" />
  </g>
  <text x="60" y="80" fill="#A5B4FC" font-family="system-ui, sans-serif" font-weight="700" font-size="16" letter-spacing="2">DEVA COSMETICS &amp; DERMA TESTING</text>
  <text x="60" y="115" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="28">Manajemen Data Uji Produk Kosmetik</text>
</svg>
